version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    environment:
      FLASK_ENV: development

  frontend:
    build: ./frontend/chatbot-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/chatbot-frontend:/app
    environment:
      NODE_ENV: development
